[project]
name = "gcd"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "einops>=0.8.1",
  "imageio[ffmpeg,pyav]>=2.37.0",
  "mmengine-lite>=0.10.7",
  "monai[einops,nibabel,tqdm]==1.2.0",
  "nibabel>=5.3.2",
  "numpy>=1.26.4",
  "pyqt6>=6.9.1",
  "pywavelets>=1.9.0",
  "scipy>=1.16.1",
  "timm>=1.0.19",
  "torch>=2.7.0",
  "torchvision>=0.22.0",
  "vtk>=9.5.0",
]

[project.optional-dependencies]
cu118 = [
  "torch>=2.7.0",
  "torchvision>=0.22.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu118", extra = "cu118" },
]
torchvision = [
  { index = "pytorch-cu118", extra = "cu118" },
]


[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[dependency-groups]
dev = [
    "pyinstaller>=6.17.0",
]
